seed: 42

model:
  backend: hf_local
  model_id: /data/Llama-3.1-8B-Instruct # /data/digirl/checkpoints/Qwen3-4B-Instruct/
  device: cuda
  dtype: auto

prompt:
  type: soft_latent
  latent_dim: 64
  init_std: 0.02

data:
  train_fraction: 0.8
  max_samples_per_client: 100
  max_trajectory_samples_per_client: 3

optimizer:
  name: cma_es
  sigma0: 0.5
  population_size: 12
  local_iterations: 10
  local_batch_size: 16

federated:
  aggregation: fedavg
  weight_by: num_examples

objective:
  latent_norm_weight: 0.05

evaluation:
  metrics:
    - accuracy

orchestrators: {}

clients:
  - id: c1
    mas: masrouter
    dataset: mmlu_pro
    dataset_name: TIGER-Lab/MMLU-Pro

  - id: c2
    mas: masrouter
    dataset: gsm_hard
    dataset_name: reasoning-machines/gsm-hard

  - id: c3
    mas: gptswarm
    dataset: mmlu_pro
    dataset_name: TIGER-Lab/MMLU-Pro

  - id: c4
    mas: gptswarm
    dataset: gsm_hard
    dataset_name: reasoning-machines/gsm-hard
