seed: 42

model:
  backend: hf_local
  model_id: /data/digirl/checkpoints/models--Qwen--Qwen2.5-7B-Instruct/snapshots/a09a35458c702b33eeacc393d103063234e8bc28/
  device: cuda
  dtype: auto

prompt:
  type: soft_latent
  latent_dim: 32
  intrinsic_dim: 32
  init_std: 0.02

optimizer:
  name: cma_es
  sigma0: 0.5
  population_size: 8
  local_iterations: 5
  local_batch_size: 16

federated:
  rounds: 10
  clients_per_round: 6
  aggregation: fedavg
  weight_by: num_examples

objective:
  task_loss_weight: 1.0
  call_cost_weight: 0.05
  token_cost_weight: 0.001
  latency_weight: 0.0
  redundant_call_weight: 0.1
  invalid_action_weight: 0.2

evaluation:
  metrics:
    - accuracy
    - exact_match
    - avg_agent_calls
    - avg_tool_calls
    - avg_tokens
    - avg_latency
    - redundant_call_rate
    - communication_bytes

orchestrators:
  puppeteer:
    reward_model_path: /data/Llama-3.1-Nemotron-70B-Reward-HF/
    global_config: configs/orchestrators/puppeteer_global.yaml
    policy_config: configs/orchestrators/puppeteer_policy.json

clients:
  - id: c1
    mas: puppeteer
    dataset: mmlu_pro
    dataset_name: TIGER-Lab/MMLU-Pro

  - id: c2
    mas: puppeteer
    dataset: gsm_hard
    dataset_name: reasoning-machines/gsm-hard

  - id: c3
    mas: masrouter
    dataset: mmlu_pro
    dataset_name: TIGER-Lab/MMLU-Pro

  - id: c4
    mas: masrouter
    dataset: gsm_hard
    dataset_name: reasoning-machines/gsm-hard

  - id: c5
    mas: gptswarm
    dataset: mmlu_pro
    dataset_name: TIGER-Lab/MMLU-Pro

  - id: c6
    mas: gptswarm
    dataset: gsm_hard
    dataset_name: reasoning-machines/gsm-hard
